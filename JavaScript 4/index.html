<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JS 4 Dom & Events</title>
    <link rel="stylesheet" href="styles.css">
    <script src="scripts.js" defer></script>
</head>
<body>
    <h1 onclick="this.innerHTML = 'Ghormeh sabzi'">What is my favourite food?</h1>

    <h1 onclick="ChangeColor(this)">Click to change color!</h1>

    <button id="MyButton">Click Me!!</button>

    <input type="text" id="words" oninput="RemoveLetterFromH1()"/>

    <div onmouseover="MouseOver(this)" onmouseout="MouseOut(this)" class="box">Hover me!!</div>
</body>
</html>
